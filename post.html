<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Flyer Post</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Nunito', sans-serif;
            width: 1080px; height: 1080px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FFD93D 100%);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Confeti */
        body::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, #fff 6px, transparent 8px),
                radial-gradient(circle at 70% 10%, #6BCB77 8px, transparent 10px),
                radial-gradient(circle at 80% 60%, #4D96FF 8px, transparent 10px),
                radial-gradient(circle at 10% 80%, #fff 6px, transparent 8px),
                radial-gradient(circle at 50% 90%, #FF6B6B 10px, transparent 12px);
            background-size: 300px 300px; opacity: 0.5; z-index: 0;
        }

        .top-section {
            background-color: #ffffff;
            display: flex; align-items: center; justify-content: space-between;
            padding: 40px 60px; border-bottom-left-radius: 60px; border-bottom-right-radius: 60px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1;
        }
        
        .header-text { text-align: left; }
        .logo { width: 180px; height: 180px; border-radius: 50%; border: 8px solid #FFD93D; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .title { font-family: 'Fredoka One', cursive; font-size: 4rem; color: #FF6B6B; letter-spacing: 2px; }
        .subtitle { font-size: 2rem; color: #4D96FF; font-weight: 900; }

        .birthday-banner {
            background: #4D96FF; color: #ffffff; text-align: center;
            padding: 20px; font-size: 3.5rem; font-family: 'Fredoka One', cursive;
            box-shadow: 0 15px 30px rgba(77, 150, 255, 0.4);
            margin: 30px 60px; border-radius: 30px; z-index: 2; transform: rotate(-2deg);
        }

        .photo-gallery {
            padding: 0 60px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; z-index: 1; margin-bottom: 30px;
        }
        .photo-item {
            position: relative; border-radius: 30px; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2); aspect-ratio: 16/9; border: 8px solid #fff;
        }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .photo-label {
            position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 107, 107, 0.95); color: #fff;
            padding: 10px; text-align: center; font-size: 2rem; font-weight: 900;
        }

        .footer {
            background-color: #ffffff; padding: 30px 60px;
            border-top-left-radius: 60px; border-top-right-radius: 60px; z-index: 1;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center;
        }
        .contact-item { display: flex; align-items: center; gap: 15px; font-size: 2.5rem; font-weight: 900; color: #1a1a1a; }
        .contact-item.wsp i { color: #25D366; font-size: 3.5rem; }
        .contact-item.ig i { color: #E1306C; font-size: 3.5rem; }
    </style>
</head>
<body>
    <div class="top-section">
        <div class="header-text">
            <div class="title">MR ALQUILERES</div>
            <div class="subtitle">¡DIVERSIÓN Y COMODIDAD!</div>
        </div>
        <img src="img/logo.jpg" class="logo">
    </div>
    
    <div class="birthday-banner">🎉 TODO PARA TU FIESTA 🎈</div>
    
    <div class="photo-gallery">
        <div class="photo-item">
            <img src="img/galeria-9.jpg"><div class="photo-label">¡Nos encargamos!</div>
        </div>
        <div class="photo-item">
            <img src="img/sillas-plegables.jpg"><div class="photo-label">Sillas y Mesas</div>
        </div>
    </div>
    
    <div class="footer">
        <div class="contact-item wsp"><i class="fa-brands fa-whatsapp"></i><span>6113-0277</span></div>
        <div class="contact-item ig"><i class="fa-brands fa-instagram"></i><span>@mralquileres</span></div>
    </div>
</body>
</html>
